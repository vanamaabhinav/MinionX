# ==============================================================================
# MinionX - Custom Minions Configuration (minions.yml)
# ==============================================================================
# In addition to the 35+ built-in Hypixel minions included by default (Cobblestone,
# Diamond, Wheat, Oak, Zombie, etc.), server owners can define unlimited brand-new,
# custom data-driven minions here.
#
# Supported Archetypes & How They Operate:
#   MINING   - Places its target ore/block on valid ground within its 5x5 area,
#              then mines and harvests it into its inventory.
#   FARMING  - Tills soil, hydrates, plants seeds/stems (Wheat, Carrots, Potatoes,
#              Pumpkins, Melons, Nether Wart, Mushrooms), and harvests once fully grown.
#   FORAGING - Plants saplings in its 5x5 area, grows trees with simulated bonemeal,
#              and chops logs from root to canopy.
#   COMBAT   - Spawns mobs on its 5x5 platform (up to `max-mobs-per-minion`), attacks
#              them with its held weapon, and collects mob drops upon slaying.
#              Supports vanilla entities (ZOMBIE, SKELETON, BLAZE, SPIDER, etc.)
#              AND MythicMobs (e.g. `target-mob: "MYTHIC_SKELETON_KING"`).
#
# Unified Drop Schema:
#   drops:
#     - material: <MATERIAL|HOOK>  # Vanilla Material or Hook (e.g., itemsadder:ruby)
#       amount: 1                  # Quantity per drop
#       chance: 1.0                # Drop rate: 1.0 = 100%, 0.50 = 50%, 0.05 = 5%
#       display-name: "&dName"     # Optional custom display name
#       custom-model-data: 1001    # Optional CustomModelData integer
#       lore:                      # Optional custom lore lines
#         - "&7Lore description"
#       glow: false                # Optional enchantment glint
#       pdc-key: "minionx:drop"    # Optional NBT / PersistentDataContainer key
#       pdc-value: "custom_drop"   # Optional PDC value
#
# Custom Drops Ecosystem Integration:
#   - Automated Selling (prices.yml): Custom drops tagged with display names,
#     CustomModelData, or PDC keys can be assigned explicit sell values under
#     `custom-prices` in prices.yml so shipping hoppers credit players accurately!
#   - Compression (recipes.yml): Super Compactor 3000 can compress custom drops
#     into high-tier enchanted versions using matching recipes in recipes.yml.
#
# Archetype-Specific Configuration Options:
#   - MINING:   `target-block: <MATERIAL>` (e.g., AMETHYST_CLUSTER, ANCIENT_DEBRIS, OBSIDIAN)
#   - FARMING:  `target-crop: <MATERIAL>`  (e.g., WHEAT, CARROT, POTATO, PUMPKIN, SUGAR_CANE)
#   - FORAGING: `target-sapling: <MATERIAL>` and `target-log: <MATERIAL>` (e.g. OAK_SAPLING / OAK_LOG)
#   - COMBAT:   `target-mob: <ENTITY_OR_MYTHIC>` (e.g. SPIDER, BLAZE, or "MYTHIC_BOSS_NAME")
#
# Per-Minion Tier Overrides (Optional `tiers:` section):
#   - If omitted, the minion adopts the global statistics defined in tiers.yml.
#   - If defined under a minion, it completely customizes action delays, storage
#     slots, and upgrade costs specifically for that individual minion type.
#
# Equipment & Visuals:
#   held-tool: DIAMOND_PICKAXE     # Tool or weapon held in the minion's right hand
#   armor-material: LEATHER        # LEATHER, IRON, GOLD, DIAMOND, NETHERITE
#   armor-color: "#FF5555"         # Leather dye color: Hex (#RRGGBB) or RGB (255,85,85)
#
# In-Game Minion Creator Studio:
#   You can build and test custom minions interactively in-game using `/minion create`!
# ==============================================================================

custom-minions:
  amethyst:
    display-name: "&dAmethyst Minion"
    archetype: MINING
    target-block: AMETHYST_CLUSTER
    held-tool: DIAMOND_PICKAXE
    max-tier: 12
    drops:
      - material: AMETHYST_SHARD
        amount: 4
        chance: 1.0

  spider_example:
    display-name: "&cSpider Hunter Minion"
    archetype: COMBAT
    target-mob: SPIDER
    held-tool: IRON_SWORD
    max-tier: 5
    drops:
      - material: STRING
        amount: 2
        chance: 1.0
      - material: SPIDER_EYE
        amount: 1
        chance: 0.5
        display-name: "&cFresh Spider Eye"
        custom-model-data: 1001
        glow: true
        pdc-key: "minionx:drop"
        pdc-value: "fresh_spider_eye"
    tiers:
      1:
        action-delay: 26.0
        storage-slots: 2
        upgrade-cost: 64
      2:
        action-delay: 23.0
        storage-slots: 3
        upgrade-cost: 128
      3:
        action-delay: 20.0
        storage-slots: 4
        upgrade-cost: 256
      4:
        action-delay: 17.0
        storage-slots: 5
        upgrade-cost: 512
      5:
        action-delay: 14.0
        storage-slots: 6
        upgrade-cost: 0
