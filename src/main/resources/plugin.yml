name: SkyBlockMinions
version: 1.0.0
main: com.skyblock.minions.SkyBlockMinions
api-version: '1.20'
author: Antigravity
description: Autonomous Hypixel SkyBlock Minions plugin for Paper/Purpur 1.20.4 - 1.21+

commands:
  minion:
    description: Main command for SkyBlock Minions
    permission: skyblockminions.use
    aliases: [minions, sbminion]
    usage: |
      &6SkyBlock Minions Commands:
      &e/minion create &7- Open In-Game Minion Creator Studio
      &e/minion give <player> <type> [tier] &7- Give a minion item
      &e/minion list &7- List your placed minions
      &e/minion reload &7- Reload configuration
  minionsx:
    description: Opens the MinionX Operator interface
    permission: skyblockminions.admin
    aliases: [minionx]
    usage: /minionsx

permissions:
  skyblockminions.admin:
    description: Allows administrative access to give minions, reload plugin, open operator hub and minion creator studio
    default: op
  skyblockminions.use:
    description: Allows players to interact with, place, and view minions
    default: true
  minions.bypass.limit:
    description: Allows bypassing the per-player minion placement limit
    default: op
