name: MinionX
version: 1.0.3
main: com.minionx.MinionX
api-version: '1.20'
author: AbhinavVanama
description: Autonomous Minion plugin for Paper / Purpur 1.20.4 - 1.21+
softdepend:
  - Vault
  - PlaceholderAPI
  - GriefPrevention
  - BentoBox
  - Towny
  - Lands
  - WorldGuard
  - AuraSkills
  - EcoSkills
  - SuperiorSkyblock2
  - EcoCollections
  - ItemsAdder
  - MMOItems
  - EcoItems
  - Geyser-Spigot
  - floodgate
  - MythicMobs

commands:
  minion:
    description: Main command for MinionX
    permission: minionx.use
    aliases: [minions, mx]
    usage: /minion
  minionx:
    description: Opens the MinionX Operator interface
    permission: minionx.admin
    aliases: [minionsx, mxop]
    usage: /minionx

permissions:
  minionx.admin:
    description: Allows administrative access to give minions, reload plugin, open operator hub and minion creator studio
    default: op
  minionx.use:
    description: Allows players to interact with, place, and view minions
    default: true
  minionx.place:
    description: Allows placing minions (checked as a fallback when minionx.use is absent)
    default: true
  minionx.storage:
    description: Allows players to open and access linked minion storage chests
    default: true
  minionx.bypass.limit:
    description: Allows bypassing the per-player minion placement limit
    default: op
  minionx.bypass.protection:
    description: Allows bypassing claim/island protection checks when placing or managing minions
    default: op
  minionx.offline.unlimited:
    description: Bypasses max offline simulation hours cap (allows unlimited catchup calculation)
    default: op
  minionx.admin.bypass:
    description: Allows interacting with and releasing quarantined minion instances
    default: op
