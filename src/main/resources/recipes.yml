# ==============================================================================
# MinionX - Super Compactor & Compression Recipes Configuration (recipes.yml)
# ==============================================================================
# Defines recipes used by the Super Compactor 3000 upgrade to compress harvested
# items into their Enchanted or condensed forms.
#
# Compactor vs Super Compactor 3000:
#   - Compactor: Automatically compresses 9 basic items into standard 3x3 blocks
#     (e.g., 9 Coal -> 1 Coal Block, 9 Iron -> 1 Iron Block).
#   - Super Compactor 3000: Uses the advanced recipes in this file to compress
#     160 raw items into high-tier Enchanted forms (e.g. 160 Cobblestone -> 1 Enchanted Cobblestone).
#
# Minion Tier Upgrades Integration (UpgradeCostHelper):
#   - Recipes defined here are automatically utilized by MinionX to determine
#     upgrade material requirements for high tiers (Tier 5+).
#   - When raw upgrade costs exceed 640 items, MinionX automatically converts the
#     cost into Enchanted items from this file so it fits in a player's inventory!
#
# Economy & Auto-Seller Integration (prices.yml):
#   - When an Enchanted item produced by Super Compactor is sold by an Automated
#     Shipping hopper, MinionX automatically calculates its sell price dynamically:
#       enchanted_price = input_amount * base_input_material_price
#     unless explicitly overridden in prices.yml!
#
# Anti-Crafting & Anti-Disassembly Protection:
#   - All enchanted items generated by MinionX are tagged with secure PersistentDataContainer
#     keys to prevent accidental disassembly or crafting exploits in vanilla tables.
#
# Schema Types:
#
# 1. Standard Vanilla Recipe:
#   <key>:
#     input: MATERIAL_NAME
#     input-amount: 160
#     output:
#       material: MATERIAL_NAME
#       display-name: "&aEnchanted Name"
#       glow: true
#
# 2. Custom Item / Plugin Recipe (Supports CustomModelData, PDC, and Plugin Hooks):
#   <key>:
#     input:
#       material: MATERIAL_NAME           # Vanilla material or 'item: hook'
#       custom-model-data: 1001           # Optional CustomModelData integer
#       display-name: "&aRaw Item Name"   # Optional display name
#       pdc-key: "minionx:drop"           # Optional PersistentDataContainer key
#       pdc-value: "custom_drop"          # Optional PersistentDataContainer value
#     input-amount: 160
#     output:
#       material: MATERIAL_NAME           # Resulting vanilla material or 'item: hook'
#       custom-model-data: 2001           # Resulting CustomModelData integer
#       display-name: "&aEnchanted Item"  # Resulting display name
#       lore:                             # Custom lore lines
#         - "&7Condensed custom essence"
#       glow: true                        # Enchantment glint
#       pdc-key: "minionx:compressed"     # Resulting PDC key
#       pdc-value: "enchanted_custom"     # Resulting PDC value
# ==============================================================================

