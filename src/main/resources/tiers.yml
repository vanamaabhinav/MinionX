# ==============================================================================
# MinionX - Global Tiers Configuration (tiers.yml)
# ==============================================================================
# Configures global tier statistics (action delays, storage capacities, and upgrade costs).
# Higher tiers act faster and hold more items in their internal inventory.
#
# Key Definitions:
#   action-delay   - Time in seconds between minion actions (spawning, harvesting, slaying).
#                    Lower values mean faster resource production.
#   storage-slots  - Number of unlocked inventory slots in the Minion GUI (from 1 up to 15 slots).
#                    Can be expanded further up to 27 slots with external Minion Storage chests!
#   upgrade-cost   - Quantity of items required to upgrade to the NEXT tier.
#
# ==============================================================================

tiers:
  1:
    action-delay: 14.0
    storage-slots: 1
    upgrade-cost: 80
