# ==============================================================================
# MinionX - Custom Upgrades Configuration (upgrades.yml)
# ==============================================================================
# Upgrades grant passive automation, compression, smelting, speed boosts,
# bonus generation, or automated item selling to Minions.
#
# Socket Locations:
#   - Upgrade Slot 1: Slot 37 (Row 5, Col 2)
#   - Upgrade Slot 2: Slot 46 (Row 6, Col 2)
#   - Automated Shipping: Slot 28 (Row 4, Col 2) - Hoppers only
#
# Supported Upgrade Types:
#   AUTO_SMELTER       - Instantly smelts raw ores into ingots and blocks into smooth
#                        variants (e.g., Cobblestone -> Stone, Raw Iron -> Iron Ingot).
#   COMPACTOR          - Compacts 9 raw items into their basic 3x3 block forms
#                        (e.g., 9 Iron Ingots -> 1 Iron Block).
#   SUPER_COMPACTOR    - Advanced compression! Compresses 160 items into their
#                        Enchanted forms using recipes defined in `recipes.yml`.
#   DIAMOND_SPREADING  - Adds a configurable percentage chance (`chance: 0.10` = 10%)
#                        to produce bonus diamonds on every single harvest action.
#   SPEED_BUFF         - Multiplies minion action speed (`speed-buff: 0.20` = +20%).
#                        Stacks additively or multiplicatively with fuels.
#   AUTO_SELLER        - Equipped in the Automated Shipping slot (Slot 28). When minion
#                        inventory and linked storage are 100% full, overflow items are
#                        automatically sold for coins using base NPC prices from `prices.yml`
#                        multiplied by `sell-ratio` (e.g. 0.50 = 50%, 0.90 = 90%).
#                        Accumulated coins can be collected with a single click.
#
# In-Game Creator & Commands:
#   - Give Upgrade: /minion give <player> upgrade <upgrade_id> [amount]
#   - Live Studio: /minion create upgrade  (or /minionsx -> Upgrades Catalog Slot 22)
# ==============================================================================

upgrades:
  auto_smelter:
    display-name: "&6Auto-Smelter"
    material: FURNACE
    type: AUTO_SMELTER
    glow: true
    lore:
      - "&7Automatically smelts harvested resources."

  compactor:
    display-name: "&6Compactor"
    material: DROPPER
    type: COMPACTOR
    glow: true
    lore:
      - "&7Automatically compacts resources into blocks."

  super_compactor:
    display-name: "&dSuper Compactor 3000"
    material: DISPENSER
    type: SUPER_COMPACTOR
    glow: true
    lore:
      - "&7Automatically compresses items into their"
      - "&7enchanted compressed forms."

  diamond_spreading:
    display-name: "&bDiamond Spreading"
    material: DIAMOND
    type: DIAMOND_SPREADING
    chance: 0.10
    glow: true
    lore:
      - "&7Adds a 10% chance to generate diamonds"
      - "&7when harvesting resources."

  minion_expander:
    display-name: "&aMinion Expander"
    material: PISTON
    type: SPEED_BUFF
    speed-buff: 0.05
    glow: true
    lore:
      - "&7Increases production speed by &a+5%&7."

  flycatcher:
    display-name: "&dFlycatcher"
    material: STRING
    type: SPEED_BUFF
    speed-buff: 0.20
    glow: true
    lore:
      - "&7Increases minion speed by &a+20%&7."

  hyper_catalyst:
    display-name: "&5Hyper Catalyst"
    material: NETHER_STAR
    type: SPEED_BUFF
    speed-buff: 0.40
    glow: true
    lore:
      - "&7Increases production speed by &a+40%&7."

  budget_hopper:
    display-name: "&eBudget Hopper"
    material: HOPPER
    type: BUDGET_HOPPER
    sell-ratio: 0.50
    glow: true
    lore:
      - "&7Automatically sells overflow items at &e50%&7"
      - "&7value when storage is completely full."

  enchanted_hopper:
    display-name: "&6Enchanted Hopper"
    material: HOPPER
    type: ENCHANTED_HOPPER
    sell-ratio: 0.90
    glow: true
    lore:
      - "&7Automatically sells overflow items at &690%&7"
      - "&7value when storage is completely full."
