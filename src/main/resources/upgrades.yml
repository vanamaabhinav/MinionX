# ==============================================================================
# MinionX - Custom Upgrades Configuration (upgrades.yml)
# ==============================================================================
# Supported Upgrade Behaviors:
#   AUTO_SMELTER       - Instantly smelts raw ores into ingots and blocks into smooth
#                        variants (e.g., Cobblestone -> Stone, Raw Iron -> Iron Ingot).
#   COMPACTOR          - Compacts 9 raw items into their basic 3x3 block forms
#                        (e.g., 9 Iron Ingots -> 1 Iron Block).
#   SUPER_COMPACTOR    - Advanced compression! Compresses 160 items into their
#                        Enchanted forms using recipes defined in `recipes.yml`.
#   ITEM_SPREADING     - Universal item spreading! Configure 1 or multiple items
#                        under `spreading-items:` with individual material, amount,
#                        and chance to generate bonus resources on harvests.
#   SPEED_BUFF         - Multiplies minion action speed (`speed-buff: 0.20` = +20%).
#                        Stacks additively or multiplicatively with fuels.
#   EXPANDER           - Expands working perimeter by +X blocks (`area-expansion: 1`).
#   AUTO_SELLER        - Equipped in the Automated Shipping slot (Slot 28). When minion
#                        inventory and linked storage are 100% full, overflow items are
#                        automatically sold for coins using base NPC prices from `prices.yml`
#                        multiplied by `sell-ratio` (e.g. 0.50 = 50%, 0.90 = 90%).
#                        Accumulated coins can be collected with a single click.
#
# Multi-Behavior vs Single Type Schema:
#   You can configure upgrades using either `type:` or `behaviors:`:
#     - `type: <BEHAVIOR>`: Single-behavior shorthand (e.g. `type: AUTO_SMELTER`).
#       Ideal for simple standalone upgrades.
#     - `behaviors: [...]`: Multi-behavior YAML list allowing a single upgrade to combine
#       multiple functions simultaneously! E.g.:
#         behaviors:
#           - SPEED_BUFF
#           - EXPANDER
#           - ITEM_SPREADING
#     - Precedence: If both `type:` and `behaviors:` are present, `behaviors:` takes precedence.
#
# Associated Configuration Keys per Behavior:
#   - ITEM_SPREADING: `spreading-items:` (List of items with material, amount, chance, etc.)
#   - SPEED_BUFF:     `speed-buff:` (Double multiplier, e.g. 0.20 = +20% speed)
#   - EXPANDER:       `area-expansion:` (Integer blocks, e.g. 1 = +1 block radius)
#   - AUTO_SELLER:    `sell-ratio:` (Double ratio, e.g. 0.50 = 50%, 0.90 = 90% NPC sell price)
# ==============================================================================

upgrades:
  auto_smelter:
    display-name: "&6Auto-Smelter"
    material: FURNACE
    type: AUTO_SMELTER
    glow: true
    lore:
      - "&7Automatically smelts harvested resources."

  compactor:
    display-name: "&6Compactor"
    material: DROPPER
    type: COMPACTOR
    glow: true
    lore:
      - "&7Automatically compacts resources into blocks."

  super_compactor:
    display-name: "&dSuper Compactor 3000"
    material: DISPENSER
    type: SUPER_COMPACTOR
    glow: true
    lore:
      - "&7Automatically compresses items into their"
      - "&7enchanted compressed forms."

  diamond_spreading:
    display-name: "&bDiamond Spreading"
    material: DIAMOND
    behaviors:
      - ITEM_SPREADING
    spreading-items:
      - material: DIAMOND
        amount: 1
        chance: 0.10
    glow: true
    lore:
      - "&7Adds a 10% chance to generate diamonds"
      - "&7when harvesting resources."

  potato_spreading:
    display-name: "&ePotato Spreading"
    material: POTATO
    behaviors:
      - ITEM_SPREADING
    spreading-items:
      - material: POTATO
        amount: 1
        chance: 0.10
    glow: true
    lore:
      - "&7Adds a 10% chance to generate potatoes"
      - "&7when harvesting resources."

  bountiful_potato:
    display-name: "&6Bountiful Potato"
    material: GOLDEN_CARROT
    behaviors:
      - ITEM_SPREADING
    spreading-items:
      - material: POTATO
        amount: 1
        chance: 0.25
      - material: POISONOUS_POTATO
        amount: 1
        chance: 0.10
      - material: BAKED_POTATO
        amount: 2
        chance: 0.05
    glow: true
    lore:
      - "&7Grants bonus potato drops on harvest:"
      - "&7- &e25% &7chance for &fPotato"
      - "&7- &e10% &7chance for &fPoisonous Potato"
      - "&7- &e5% &7chance for &f2x Baked Potato"

  minion_expander:
    display-name: "&aMinion Expander"
    material: PISTON
    behaviors:
      - SPEED_BUFF
      - EXPANDER
    speed-buff: 0.05
    area-expansion: 1
    glow: true
    lore:
      - "&7Increases production speed by &a+5%&7."
      - "&7Expands working area by &a+1 block&7."
      - "&7(5x5 -> 7x7 -> 9x9 when stacked!)"

  flycatcher:
    display-name: "&dFlycatcher"
    material: STRING
    type: SPEED_BUFF
    speed-buff: 0.20
    glow: true
    lore:
      - "&7Increases minion speed by &a+20%&7."

  hyper_catalyst:
    display-name: "&5Hyper Catalyst"
    material: NETHER_STAR
    type: SPEED_BUFF
    speed-buff: 0.40
    glow: true
    lore:
      - "&7Increases production speed by &a+40%&7."

  budget_hopper:
    display-name: "&eBudget Hopper"
    material: HOPPER
    type: AUTO_SELLER
    sell-ratio: 0.50
    glow: true
    lore:
      - "&7Automatically sells overflow items at &e50%&7"
      - "&7value when storage is completely full."

  enchanted_hopper:
    display-name: "&6Enchanted Hopper"
    material: HOPPER
    type: AUTO_SELLER
    sell-ratio: 0.90
    glow: true
    lore:
      - "&7Automatically sells overflow items at &690%&7"
      - "&7value when storage is completely full."
