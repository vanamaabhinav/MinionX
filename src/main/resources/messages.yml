# ==============================================================================
# MinionX - Language, Alerts & Messages Configuration (messages.yml)
# ==============================================================================
# Customize all user-facing chat messages, alerts, security warnings, and prefixes.
#
# Color & Formatting Codes:
#   - Standard Minecraft codes: &0 - &9, &a - &f, &k, &l, &m, &n, &o, &r
#   - Modern RGB Hex colors: #RRGGBB (e.g. #FF5555 for vibrant red)
#
# Global Placeholders:
#   %player%  - Player username
#   %minion%  - Minion name (e.g., Diamond Minion)
#   %tier%    - Tier number or Roman numeral (e.g., V)
#   %amount%  - Count or quantity of items
#   %time%    - Formatted duration (e.g., 2 hours, 1 day)
#   %xp%      - Skill or player experience gained
#   %limit%   - Max placement limit
#   %fuel%    - Name of active fuel
# ==============================================================================

prefix: "&6&l[Minion&c&lX&6&l] &r"

messages:
  prefix: "&6&l[Minion&c&lX&6&l] &r"
  fuel-burned-out: "&cThe active %fuel% burned out and was consumed!"
  fuel-extended: "&aEquipped &f%amount%x %fuel%&a! Fuel duration: &e%time%&a."
  cannot-stack-permanent-fuel: "&cThis minion already has permanent fuel installed!"
  placed: "&aYou placed a %minion%!"
  picked-up: "&eYou picked up your %minion%!"
  upgraded: "&aUpgraded %minion% to Tier %tier%!"
  not-enough-resources: "&cYou don't have enough resources to upgrade this minion!"
  already-max-tier: "&cThis minion is already at maximum tier!"
  collected: "&aCollected %amount% items and &e+%xp% XP &afrom your minion!"
  inventory-full: "&cYour inventory is too full to collect all items!"
  area-blocked: "&cCannot place minion here! Ensure a flat 5x5 platform is available."
  no-permission: "&cYou do not have permission to do this."

  # Security & Limits Messages
  minion-limit-reached: "&cYou have reached your maximum minion limit of %limit%!"
  minion-already-exists: "&cThere is already a minion here! Only one minion may occupy a block."
  cannot-place-fuel-or-upgrade: "&cYou cannot place minion items or fuels in the world!"
  cannot-eat-minion-item: "&cYou cannot consume minion items or fuels!"
  cannot-craft-with-minion-item: "&cYou cannot use minion items or upgrades in crafting recipes!"
  no-island-place-permission: "&cYou do not have permission to place minions here!"
  no-island-access-permission: "&cYou do not have permission to access this minion!"
  no-minion-access-permission: "&cYou do not have permission to access this minion!"
  cannot-pickup-coop: "&cYou cannot pick up this minion! Only the minion owner (%owner%) or an admin can pick it up."
  cannot-break-chest: "&cYou cannot break this storage chest! It is linked to %owner%'s minion."
  partially-obstructed-status: "&ePartially Obstructed"
  no-mobs-in-range-status: "&cNo Mobs in Range!"

# ==============================================================================
# MINION DIALOGUES & FLOATING SPEECH BUBBLES
# ==============================================================================
# Minions occasionally speak cheerful, funny, or motivational quips while working
# or when clicked by their owner!
#
# Mechanics:
#   - Spoken dialogues float as lightweight temporary hologram text directly
#     above the minion's head for `duration-seconds`.
#   - Archetype-specific: Minions automatically pick lines matching their archetype
#     (mining, foraging, farming, combat), falling back to 'general' lines.
#   - Feel free to add unlimited custom phrases below to match your server's theme!
# ==============================================================================
dialogues:
  enabled: true
  format: "&e\"%message%\""
  duration-seconds: 5
  messages:
    general:
      - "Hard at work!"
      - "Look at all these resources!"
      - "Can't stop, won't stop!"
      - "Efficiency at its finest!"
      - "Another one for the collection!"
      - "I love working on this island!"
    mining:
      - "Strike the earth!"
      - "So much cobblestone and ore!"
      - "Found another vein!"
      - "My pickaxe never rests!"
    foraging:
      - "Chopping away all day!"
      - "Timber! That was a big tree!"
      - "Fresh wood collected!"
    farming:
      - "Crops are growing fast!"
      - "Time for a bountiful harvest!"
      - "Nothing beats fresh produce!"
    combat:
      - "Guarding the perimeter!"
      - "Target eliminated!"
      - "Keeping the island safe!"
