# ==============================================================================
# SkyBlock Minions Configuration
# Inspired by Hypixel SkyBlock
# ==============================================================================

settings:
  # Size of the minion's working area (radius in blocks from center, 2 = 5x5 area)
  working-radius: 2
  # Auto-save interval in ticks (6000 ticks = 5 minutes)
  auto-save-interval: 6000
  # Minion tick cycle check interval in ticks (20 ticks = 1 second)
  tick-interval: 20
  # Play animation and sound effects
  enable-animations: true
  enable-sounds: true
  enable-particles: true

