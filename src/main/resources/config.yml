# ==============================================================================
# CUSTOM ITEM LORE (Fully editable item descriptions)
# ==============================================================================
item-lore:
  minion-item:
    - "&7Time Between Actions: &a%delay%s"
    - "&7Max Storage: &e%capacity% items &7(%slots% slots)"
    - "&7"
    - "&7Place this minion down to generate"
    - "&7and harvest resources on your island!"
    - "&7"
    - "&eRight-click on the ground to place!"

gui:
  head-lore:
    - "&7Time Between Actions: &a%delay%s"
    - "&7Total Harvested: &e%harvested% items"
    - "&7Storage: &e%stored% / %capacity% items"
    - "&7Status: %status%"

# ==============================================================================
# CUSTOM FUELS (Add new fuels here without writing any Java code!)
# ==============================================================================
# Options:
#   display-name: Item display name (supports '&' color codes)
#   material: Minecraft Material name (e.g. COAL, LAVA_BUCKET, DAYLIGHT_DETECTOR)
#   speed-buff: Speed increase as decimal (0.05 = +5%, 0.25 = +25%)
#   duration: Duration ("30m", "36h", "permanent", or "-1")
#   glow: true/false
#   custom-model-data: 0
#   lore: List of lore lines
fuels:
  coal:
    display-name: "&fCoal"
    material: COAL
    speed-buff: 0.05
    duration: "30m"
    glow: false
    lore:
      - "&7Increases minion speed by &a+5%&7."
      - "&7Duration: &e30 minutes"

  charcoal:
    display-name: "&fCharcoal"
    material: CHARCOAL
    speed-buff: 0.05
    duration: "30m"
    glow: false
    lore:
      - "&7Increases minion speed by &a+5%&7."
      - "&7Duration: &e30 minutes"

  enchanted_charcoal:
    display-name: "&aEnchanted Charcoal"
    material: CHARCOAL
    speed-buff: 0.20
    duration: "36h"
    glow: true
    lore:
      - "&7Increases minion speed by &a+20%&7."
      - "&7Duration: &e36 hours"

  enchanted_lava_bucket:
    display-name: "&6Enchanted Lava Bucket"
    material: LAVA_BUCKET
    speed-buff: 0.25
    duration: "permanent"
    glow: true
    lore:
      - "&7Increases minion speed by &a+25%&7."
      - "&7Duration: &bPermanent"

  plasma_bucket:
    display-name: "&dPlasma Bucket"
    material: LAVA_BUCKET
    speed-buff: 0.35
    duration: "permanent"
    glow: true
    lore:
      - "&7Increases minion speed by &a+35%&7."
      - "&7Duration: &bPermanent"

  solar_panel:
    display-name: "&eSolar Panel"
    material: DAYLIGHT_DETECTOR
    speed-buff: 0.25
    duration: "permanent"
    glow: true
    lore:
      - "&7Increases minion speed by &a+25%&7."
      - "&7Duration: &bPermanent"

# ==============================================================================
# CUSTOM UPGRADES / ACCESSORIES
# ==============================================================================
# Options:
#   display-name: Item display name
#   material: Minecraft Material name
#   type: SPEED_BUFF, AUTO_SMELTER, COMPACTOR, DIAMOND_SPREADING
#   speed-buff: Speed increase (e.g. 0.05 = +5%)
#   chance: Probability for chance upgrades (e.g. 0.10 = 10%)
#   glow: true/false
#   lore: List of lore lines
upgrades:
  auto_smelter:
    display-name: "&6Auto-Smelter"
    material: FURNACE
    type: AUTO_SMELTER
    glow: true
    lore:
      - "&7Automatically smelts harvested resources."

  compactor:
    display-name: "&6Compactor"
    material: DROPPER
    type: COMPACTOR
    glow: true
    lore:
      - "&7Automatically compacts resources into blocks."

  diamond_spreading:
    display-name: "&bDiamond Spreading"
    material: DIAMOND
    type: DIAMOND_SPREADING
    chance: 0.10
    glow: true
    lore:
      - "&7Adds a 10% chance to generate diamonds"
      - "&7when harvesting resources."

  minion_expander:
    display-name: "&aMinion Expander"
    material: PISTON
    type: SPEED_BUFF
    speed-buff: 0.05
    glow: true
    lore:
      - "&7Increases production speed by &a+5%&7."

  flycatcher:
    display-name: "&dFlycatcher"
    material: STRING
    type: SPEED_BUFF
    speed-buff: 0.20
    glow: true
    lore:
      - "&7Increases minion speed by &a+20%&7."

  hyper_catalyst:
    display-name: "&5Hyper Catalyst"
    material: NETHER_STAR
    type: SPEED_BUFF
    speed-buff: 0.40
    glow: true
    lore:
      - "&7Increases production speed by &a+40%&7."

# ==============================================================================
# COLLECTION COMMANDS (Skill EXP, Collections, Economy integration)
# ==============================================================================
# Placeholders:
#   %player%, %player_uuid%, %amount%, %item%, %minion_type%, %minion_tier%,
#   %minion_tier_roman%, %total_harvested%, %stored%, %max_capacity%, %world%, %x%, %y%, %z%
# Inline Math Expressions:
#   {amount * 2.5}, {amount * 10}, {amount / 2}
collection-commands:
  enabled: true
  global: []
  types:
    cobblestone: []
    iron: []
    diamond: []

# Messages
messages:
  prefix: "&6[Minions] &r"
  placed: "&aYou placed a %minion%!"
  picked-up: "&eYou picked up your %minion%!"
  upgraded: "&aUpgraded %minion% to Tier %tier%!"
  not-enough-resources: "&cYou don't have enough resources to upgrade this minion!"
  already-max-tier: "&cThis minion is already at maximum tier!"
  collected: "&aCollected %amount% items from your minion!"
  inventory-full: "&cYour inventory is too full to collect all items!"
  area-blocked: "&cCannot place minion here! Ensure a flat 5x5 platform is available."
  no-permission: "&cYou do not have permission to do this."