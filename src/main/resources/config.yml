# ==============================================================================
# SUPER COMPACTOR RECIPES
# ==============================================================================
# Defines how the Super Compactor converts raw items into compressed forms.
compression-recipes:
  cobblestone:
    input: COBBLESTONE
    input-amount: 160
    output:
      material: COBBLESTONE
      display-name: "&aEnchanted Cobblestone"
      glow: true
  iron:
    input: IRON_INGOT
    input-amount: 160
    output:
      material: IRON_BLOCK
      display-name: "&aEnchanted Iron"
      glow: true
  diamond:
    input: DIAMOND
    input-amount: 160
    output:
      material: DIAMOND
      display-name: "&aEnchanted Diamond"
      glow: true
  rotten_flesh:
    input: ROTTEN_FLESH
    input-amount: 160
    output:
      material: ROTTEN_FLESH
      display-name: "&aEnchanted Rotten Flesh"
      glow: true
  bone:
    input: BONE
    input-amount: 160
    output:
      material: BONE_BLOCK
      display-name: "&aEnchanted Bone"
      glow: true

