# ==============================================================================
# COLLECTION SYSTEM & COMMAND REWARDS
# ==============================================================================
# MinionX features native, plug-and-play integrations for top collection plugins:
#   * EcoCollections: Automatically detected and credited via direct API.
#   * SuperiorSkyblock2: Automatically forwards progress to Island Collections.
#
# NOTE: If you are using EcoCollections or SuperiorSkyblock2, NO commands are
# needed below; collections will update automatically out of the box!
#
# For ANY other collections, battlepass, quest, leveling, or economy plugins,
# you can configure console commands below. Commands execute synchronously
# whenever a player collects harvested items from a minion (via "Collect All"
# or individual slot clicks).
#
# Available Placeholders:
#   %player%            - Player username (e.g., Steve)
#   %player_uuid%       - Player UUID
#   %amount%            - Amount of items collected (e.g., 64)
#   %item%              - Material name of collected item (e.g., COBBLESTONE)
#   %item_material%     - Same as %item%
#   %minion_type%       - Display name of minion (e.g., Cobblestone)
#   %minion_type_id%    - Internal minion ID (e.g., cobblestone)
#   %minion_tier%       - Current tier number (e.g., 5)
#   %minion_tier_roman% - Current tier in Roman numerals (e.g., V)
#   {expression}        - Inline math evaluation, e.g., {amount * 1.5}
#   PlaceholderAPI      - All PAPI placeholders are supported if PAPI is installed.
#
# Sections:
#   global: Runs on EVERY collection event across all minion types.
#   types.<minion_id>: Runs ONLY when collecting from that specific minion type.
# ==============================================================================
collection-commands:
  enabled: true
  # Global commands run on every collection event
  # Example: - "collections add %player% %item% %amount%"
  global: []
  # Type-specific commands run only for the specified minion ID
  types:
    cobblestone: []
    # Example:
    #   - "quests progress %player% mine_cobble %amount%"
    iron: []
    diamond: []

# ==============================================================================
# MINION GUI LAYOUT CUSTOMIZATION (Standard MinionX Layout)
# ==============================================================================
# Configure the exact inventory slot positions for all components within the
# 54-slot (6-row x 9-column) Minion Management GUI.
#
# Slot Indexing Quick Reference:
#   Row 1: [ 0,  1,  2,  3,  4,  5,  6,  7,  8]
#   Row 2: [ 9, 10, 11, 12, 13, 14, 15, 16, 17]
#   Row 3: [18, 19, 20, 21, 22, 23, 24, 25, 26]
#   Row 4: [27, 28, 29, 30, 31, 32, 33, 34, 35]
#   Row 5: [36, 37, 38, 39, 40, 41, 42, 43, 44]
#   Row 6: [45, 46, 47, 48, 49, 50, 51, 52, 53]
#
# Slot Functions:
#   ideal-layout       - (Slot 3) Informational guide book showing ideal 5x5 minion setup.
#   head               - (Slot 4) Central minion stat skull showing lifetime harvests & status.
#   next-tier          - (Slot 5) Preview button showing stats gained by upgrading to next tier.
#   skin               - (Slot 10) Minion skin cosmetic slot (located right above Fuel).
#   fuel               - (Slot 19) Socket for temporary or permanent minion fuels (fuels.yml).
#   automated-shipping - (Slot 28) Socket for Budget or Enchanted hoppers (prices.yml).
#   upgrade-1          - (Slot 37) Primary modifier slot (Compactor, Auto-Smelter, etc.).
#   upgrade-2          - (Slot 46) Secondary modifier slot (Diamond Spreading, Flycatcher, etc.).
#   collect-all        - (Slot 48) One-click button to collect all stored items and grant skill XP.
#   upgrade-tier       - (Slot 50) Button to upgrade minion to next tier using inventory resources.
#   pickup             - (Slot 53) Reclaims minion, fuels, skins, upgrades, and items safely.
#   storage            - (Slots 21-25, 30-34, 39-43) Symmetrical 3x5 grid (15 slots total).
#                        Slots unlock progressively as minion tier increases (tiers.yml).
# ==============================================================================
gui:
  minion-menu:
    slots:
      ideal-layout: 3
      head: 4
      next-tier: 5
      skin: 10
      fuel: 19
      automated-shipping: 28
      upgrade-1: 37
      upgrade-2: 46
      collect-all: 48
      upgrade-tier: 50
      pickup: 53
      storage:
        - 21
        - 22
        - 23
        - 24
        - 25
        - 30
        - 31
        - 32
        - 33
        - 34
        - 39
        - 40
        - 41
        - 42
        - 43

# ==============================================================================
# MESSAGES & CHAT FORMATTING (Also configurable in messages.yml)
# ==============================================================================
messages:
  prefix: "&6&l[Minion&c&lX&6&l] &r"
  placed: "&aYou placed a %minion%!"
  picked-up: "&eYou picked up your %minion%!"
  upgraded: "&aUpgraded %minion% to Tier %tier%!"
  not-enough-resources: "&cYou don't have enough resources to upgrade this minion!"
  already-max-tier: "&cThis minion is already at maximum tier!"
  collected: "&aCollected %amount% items and &e+%xp% XP &afrom your minion!"
  inventory-full: "&cYour inventory is too full to collect all items!"
  area-blocked: "&cCannot place minion here! Ensure a flat 5x5 platform is available."
  no-permission: "&cYou do not have permission to do this."
  minion-limit-reached: "&cYou have reached your maximum minion limit of %limit%!"
  minion-already-exists: "&cThere is already a minion here! Only one minion may occupy a block."
  cannot-place-fuel-or-upgrade: "&cYou cannot place minion items or fuels in the world!"
  cannot-eat-minion-item: "&cYou cannot consume minion items or fuels!"
  cannot-craft-with-minion-item: "&cYou cannot use minion items or upgrades in crafting recipes!"
  no-island-place-permission: "&cYou do not have permission to place minions here!"
  no-island-access-permission: "&cYou do not have permission to access this minion!"
  no-minion-access-permission: "&cYou do not have permission to access this minion!"
  partially-obstructed-status: "&ePartially Obstructed"

# ==============================================================================
# MINION STORAGE SYMMETRICAL SLOT CONFIGURATION
# ==============================================================================
# When players open a linked Minion Storage chest (Small, Medium, Large, etc.),
# MinionX displays a 27-slot chest GUI. By default, unlocked slots are calculated
# mathematically to radiate symmetrically outward from the exact center (Slot 13):
#
#   Capacity 1  -> [13]
#   Capacity 3  -> [12, 13, 14]
#   Capacity 9  -> Full row 2: [9, 10, 11, 12, 13, 14, 15, 16, 17]
#   Capacity 15 -> Symmetrical grid across rows 1, 2, 3
#   Capacity 27 -> Entire 27-slot inventory unlocked
#
# If you prefer to manually define specific slot patterns for each capacity level,
# set `use-custom-layouts: true` and configure the slot lists below:
# ==============================================================================
storage-layouts:
  use-custom-layouts: false
  # Example custom layout definition:
  # layouts:
  #   9: [10, 11, 12, 13, 14, 15, 16, 19, 20]
  #   15: [1, 2, 3, 4, 5, 6, 7, 10, 11, 12, 13, 14, 15, 16, 19]

# ==============================================================================
# DATABASE & PERSISTENCE STORAGE
# ==============================================================================
# MinionX works completely out-of-the-box with ZERO database setup required!
# Supported storage backends:
#   - YAML   : (Default) Ultra-fast, self-contained flat file (plugins/MinionX/data/minions.yml).
#              Requires zero setup, zero drivers, and features atomic writes to prevent corruption.
#   - SQLITE : Local zero-configuration embedded database (plugins/MinionX/data/minions.db).
#   - MYSQL  : External relational database for multi-server networks.
# ==============================================================================
storage:
  # Storage type: YAML (Recommended default), SQLITE, or MYSQL
  type: "YAML"
  mysql:
    host: "localhost"
    port: 3306
    database: "minions"
    username: "root"
    password: ""

# ==============================================================================
# UPDATES & METRICS
# ==============================================================================
update-checker:
  # Asynchronously checks the GitHub API on startup to see if a newer version
  # of MinionX has been released. If an update is available, notifies console
  # and operators upon joining. Does not block server startup.
  enabled: true

metrics:
  # Sends anonymous plugin usage statistics to bStats.org (e.g. server version,
  # Java version, and minion count). Helps developers track popularity and prioritize updates.
  # No player names, IP addresses, or sensitive island coordinates are ever sent.
  enabled: true

