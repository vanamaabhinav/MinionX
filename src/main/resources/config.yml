# ==============================================================================
# MinionX - Hypixel SkyBlock Inspired Minions Configuration
# ==============================================================================

settings:
  # Tick interval for the minion AI task (20 ticks = 1 second)
  tick-interval: 20
  # Periodic auto-save interval in ticks (6000 ticks = 5 minutes)
  auto-save-interval: 6000
  # Visual animations, sounds, and particles
  enable-animations: true
  enable-sounds: true
  enable-particles: true

# ==============================================================================
# FLOATING NAMETAGS (Holograms)
# ==============================================================================
nametags:
  # Display mode:
  # ALWAYS    - Hologram is always visible floating above the minion.
  # TARGETED  - Nametag only shows when looking/pointing directly at the minion (reduces visual clutter).
  # DISABLED  - Disables nametags completely (eliminates all hologram entities, zero lag).
  mode: ALWAYS

  # Nametag format. Supported Placeholders:
  # %tier%        - Numeric tier level (e.g., 1, 5, 11)
  # %tier_roman%  - Roman numeral level (e.g., I, V, XI)
  # %minion_name% - Display name of the minion (e.g., Cobblestone, Iron, Diamond)
  # %status%      - Current minion state (e.g., Working..., Full, Blocked)
  # %total%       - Total items harvested by this minion
  format: "&e[Lv.%tier_roman%] &a%minion_name% Minion &7(%status%&7)"

# ==============================================================================
# MINION TIERS (Action Speeds, Storage Slots & Upgrade Costs)
# ==============================================================================
# Fully customizable! Non-coders can change speeds, capacities, upgrade costs,
# or even add Tier 12, Tier 13, etc. by appending new numbered sections below.
tiers:
  1:
    action-delay: 14.0
    storage-slots: 1
    upgrade-cost: 80
  2:
    action-delay: 14.0
    storage-slots: 3
    upgrade-cost: 160
  3:
    action-delay: 12.5
    storage-slots: 3
    upgrade-cost: 320
  4:
    action-delay: 12.5
    storage-slots: 6
    upgrade-cost: 640
  5:
    action-delay: 11.0
    storage-slots: 6
    upgrade-cost: 1280
  6:
    action-delay: 11.0
    storage-slots: 9
    upgrade-cost: 2560
  7:
    action-delay: 9.5
    storage-slots: 9
    upgrade-cost: 5120
  8:
    action-delay: 9.5
    storage-slots: 12
    upgrade-cost: 10240
  9:
    action-delay: 8.0
    storage-slots: 12
    upgrade-cost: 20480
  10:
    action-delay: 8.0
    storage-slots: 15
    upgrade-cost: 40960
  11:
    action-delay: 7.0
    storage-slots: 15
    upgrade-cost: 0

