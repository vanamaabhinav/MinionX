# ==============================================================================
# MinionX - Autonomous Minions Configuration
# ==============================================================================
# Welcome to MinionX!
# To keep this configuration file clean and easy to navigate, modular settings
# have been organized into dedicated files:
#
#   - tiers.yml     : Minion tiers (1-12+), action speeds, storage, and costs
#   - minions.yml   : Custom minions with multi-drop chances & equipment
#   - fuels.yml     : Custom fuels, speed buffs, durations & glowing effects
#   - upgrades.yml  : Custom upgrades, accessories, hoppers & expanders
#   - recipes.yml   : Super Compactor 3000 compression recipes
#   - messages.yml  : Chat messages, broadcasts, alerts & minion dialogues
# ==============================================================================

settings:
  # If true, temporary fuels (Coal, Charcoal, etc.) burn out and disappear when removed.
  # Permanent fuels (Enchanted Lava Bucket, Plasma Bucket, Solar Panel) can always be retrieved.
  destroy-temporary-fuel-on-removal: true
  # Geyser / Bedrock edition touch friendly menu mode
  geyser-touch-friendly: true
  # Tick interval for the minion AI task (1 tick = sub-second distributed spread)
  tick-interval: 1
  # Periodic auto-save interval in ticks (6000 ticks = 5 minutes)
  auto-save-interval: 6000
  # Maximum placed minions per player (-1 for unlimited)
  # Players with permission "minionx.bypass.limit" bypass this restriction
  # Also supports permission nodes: minionx.limit.<number> (e.g. minionx.limit.10)
  max-minions-per-player: 5
  # Maximum offline simulation time in hours (default 720 = 30 days)
  max-offline-hours: 720
  # Visual animations, sounds, and particles
  enable-animations: true
  enable-sounds: true
  enable-particles: true

  # ============================================================================
  # EMERGENCY QUARANTINE MODE (Anti-Dupe & Exploit Failsafe)
  # ============================================================================
  # When enabled, the plugin enters strict lockdown mode to stop exploits immediately:
  #   - Blocks all minion item pickups and placement
  #   - Blocks minion storage chest placement, opening, and breaking
  #   - Freezes inventory withdrawals and item collections
  #
  # Players with permission "minionx.quarantine.bypass" or OPs can still interact.
  # Can also be toggled live in-game via `/minionsx` (Slot 51) or `/minion quarantine`.
  quarantine-mode: false

  # If true, minion harvesting AI tick loop is completely paused during quarantine.
  # If false, minions continue working in the background but players cannot withdraw.
  quarantine-freeze-ticks: false

  # ============================================================================
  # COMBAT MINIONS CONFIGURATION
  # ============================================================================
  combat:
    # Maximum alive mobs spawned by a single combat minion in its 5x5 area at once.
    # Prevents mob stacking, entity lag, and runaway spawning if left unattended.
    max-mobs-per-minion: 5

    # Control natural mob wandering AI:
    #   true  - Disables mob AI wandering. Mobs stand still until slain by minion.
    #           Recommended for massive server performance and zero entity pathfinding lag.
    #   false - Mobs wander naturally inside their enclosed 5x5 platform.
    disable-mob-wandering: false

# ==============================================================================
# STORAGE ENGINE (YAML, SQLITE, or MYSQL)
# ==============================================================================
# Choose where active minion data, placed locations, inventories, and tiers are saved:
#
#   YAML   - Flat-file storage saved in plugins/MinionX/minions_data.yml.
#            Zero database configuration required. Ideal for small-to-medium servers.
#
#   SQLITE - High-speed local embedded database saved in plugins/MinionX/minions.db.
#            Provides ACID compliance, corruption resistance, and fast async queries.
#            Recommended for medium-to-large single servers.
#
#   MYSQL  - Enterprise relational database for multi-server networks and Bungee/Velocity.
#            Allows cross-server minion synchronization and network-wide data centralization.
#            Tables and schemas are automatically created on first startup.
# ==============================================================================
storage:
  type: YAML # Options: YAML (default), SQLITE, MYSQL
  sqlite:
    file: "minions.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "minions"
    username: "root"
    password: ""
    # Advanced connection pool settings
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 5000

# ==============================================================================
# FLOATING NAMETAGS (Holograms)
# ==============================================================================
nametags:
  # Display mode:
  # ALWAYS    - Hologram is always visible floating above the minion.
  # TARGETED  - Nametag only shows when looking/pointing directly at the minion (reduces visual clutter).
  # DISABLED  - Disables nametags completely (eliminates all hologram entities, zero lag).
  mode: ALWAYS

  # Nametag format. Supported Placeholders:
  # %tier%        - Numeric tier level (e.g., 1, 5, 11)
  # %tier_roman%  - Roman numeral level (e.g., I, V, XI)
  # %minion_name% - Display name of the minion (e.g., Cobblestone, Iron, Diamond)
  # %status%      - Current minion state (e.g., Working..., Full, Blocked)
  # %total%       - Total items harvested by this minion
  format: "&e[Lv.%tier_roman%] &a%minion_name% Minion &7(%status%&7)"

# ==============================================================================
# RPG SKILL REWARDS (AuraSkills, EcoSkills, & mcMMO)
# ==============================================================================
# Grants skill experience points to players when collecting resources from minions.
# Automatically detects and hooks into:
#   * AuraSkills (formerly EcoSkills)
#   * mcMMO
#
# Supported Skill Names:
#   mining, foraging, farming, combat, fishing, agility, alchemy, enchanting
#
# Schema:
#   <minion_type_id>:
#     skill: "<skill_name>"
#     xp-per-item: <float>  # Amount of skill XP granted per single collected item
# ==============================================================================
